<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mật mã Hill 2x2 - Web App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1a1a24;
            border: 1px solid #2a2a38;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #00ffc8;
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* Khung Ma trận 2x2 */
        .matrix-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 160px;
            margin: 0 auto 15px auto;
        }

        .matrix-input {
            width: 100%;
            height: 45px;
            background-color: #252533;
            border: 2px solid #3a3a4c;
            border-radius: 6px;
            color: #00ffc8;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .matrix-input:focus {
            border-color: #00ffc8;
        }

        /* Thanh trạng thái Ma trận */
        .status-box {
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status-valid {
            background-color: rgba(0, 255, 200, 0.1);
            color: #00ffc8;
            border: 1px solid rgba(0, 255, 200, 0.3);
        }

        .status-invalid {
            background-color: rgba(255, 70, 70, 0.1);
            color: #ff4646;
            border: 1px solid rgba(255, 70, 70, 0.3);
        }

        /* Form nhập văn bản */
        .form-group {
            margin-bottom: 15px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            background-color: #252533;
            border: 1px solid #3a3a4c;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #00ffc8;
        }

        /* Nút thao tác */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-encrypt {
            background-color: #1a73e8;
            color: white;
        }

        .btn-decrypt {
            background-color: #34a853;
            color: white;
        }

        .btn-swap {
            background-color: #3a3a4c;
            color: #ccc;
            flex: 0.4;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Kết quả */
        .output-box {
            background-color: #111118;
            border: 1px solid #2a2a38;
            border-radius: 6px;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #00ffc8;
            word-break: break-all;
            min-height: 48px;
            display: flex;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>MẬT MÃ HILL (2x2)</h1>

        <!-- Khung ma trận K -->
        <div class="section-title" style="text-align: center;">MA TRẬN KHÓA K (2x2)</div>
        <div class="matrix-grid">
            <input type="number" id="k11" class="matrix-input" value="3">
            <input type="number" id="k12" class="matrix-input" value="3">
            <input type="number" id="k21" class="matrix-input" value="2">
            <input type="number" id="k22" class="matrix-input" value="5">
        </div>

        <!-- Thông báo tình trạng ma trận -->
        <div id="statusBox" class="status-box status-valid">
            Ma trận hợp lệ (det = 9, mod 26 = 9)
        </div>

        <!-- Nhập liệu -->
        <div class="form-group">
            <div class="section-title">VĂN BẢN ĐẦU VÀO:</div>
            <input type="text" id="inputText" value="HELP" placeholder="Nhập văn bản cần xử lý...">
        </div>

        <!-- Nút hành động -->
        <div class="btn-group">
            <button class="btn-encrypt" onclick="handleEncrypt()">🔒 Mã hóa</button>
            <button class="btn-swap" onclick="handleSwap()" title="Đưa kết quả lên ô đầu vào">⬆️ Dán</button>
            <button class="btn-decrypt" onclick="handleDecrypt()">🔓 Giải mã</button>
        </div>

        <!-- Kết quả -->
        <div class="form-group">
            <div class="section-title">KẾT QUẢ:</div>
            <div id="outputText" class="output-box">HI</div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. TOÁN HỌC MODULO & NGHỊCH ĐẢO
        // -------------------------------------------------------------
        function mod(n, m = 26) {
            return ((n % m) + m) % m;
        }

        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        function modInverse(a, m = 26) {
            a = mod(a, m);
            for (let x = 1; x < m; x++) {
                if ((a * x) % m === 1) return x;
            }
            return null;
        }

        function getMatrixK() {
            const k11 = parseInt(document.getElementById('k11').value) || 0;
            const k12 = parseInt(document.getElementById('k12').value) || 0;
            const k21 = parseInt(document.getElementById('k21').value) || 0;
            const k22 = parseInt(document.getElementById('k22').value) || 0;
            return [[k11, k12], [k21, k22]];
        }

        // -------------------------------------------------------------
        // 2. KIỂM TRA ĐIỀU KIỆN MA TRẬN
        // -------------------------------------------------------------
        function checkMatrixStatus() {
            const K = getMatrixK();
            const det = K[0][0] * K[1][1] - K[0][1] * K[1][0];
            const detMod26 = mod(det, 26);
            const inv = modInverse(detMod26, 26);

            const statusBox = document.getElementById('statusBox');

            if (inv !== null) {
                statusBox.className = "status-box status-valid";
                statusBox.innerText = `✓ Ma trận hợp lệ (det = ${det}, mod 26 = ${detMod26})`;
                return true;
            } else {
                statusBox.className = "status-box status-invalid";
                statusBox.innerText = `✖ Không thể giải mã! det(K) = ${detMod26} không nguyên tố cùng nhau với 26.`;
                return false;
            }
        }

        // Lắng nghe sự kiện thay đổi trên các ô nhập ma trận
        document.querySelectorAll('.matrix-input').forEach(input => {
            input.addEventListener('input', checkMatrixStatus);
        });

        // -------------------------------------------------------------
        // 3. THUẬT TOÁN MÃ HÓA & GIẢI MÃ HILL
        // -------------------------------------------------------------
        function encryptHill(text, K) {
            text = text.toUpperCase().replace(/[^A-Z]/g, '');
            if (!text) return '';
            if (text.length % 2 !== 0) text += 'X'; // Thêm ký tự độn nếu lẻ

            let ciphertext = '';
            for (let i = 0; i < text.length; i += 2) {
                const p1 = text.charCodeAt(i) - 65;
                const p2 = text.charCodeAt(i + 1) - 65;

                const c1 = mod(K[0][0] * p1 + K[0][1] * p2, 26);
                const c2 = mod(K[1][0] * p1 + K[1][1] * p2, 26);

                ciphertext += String.fromCharCode(c1 + 65) + String.fromCharCode(c2 + 65);
            }
            return ciphertext;
        }

        function decryptHill(ciphertext, K) {
            const det = K[0][0] * K[1][1] - K[0][1] * K[1][0];
            const detMod26 = mod(det, 26);
            const detInv = modInverse(detMod26, 26);

            if (detInv === null) {
                alert("Ma trận khóa K không thể dùng để giải mã vì gcd(det(K), 26) != 1!");
                return '';
            }

            // Tìm ma trận nghịch đảo K^-1 mod 26
            // Adj(K) = [[d, -b], [-c, a]]
            const K_inv = [
                [mod(detInv * K[1][1], 26), mod(detInv * -K[0][1], 26)],
                [mod(detInv * -K[1][0], 26), mod(detInv * K[0][0], 26)]
            ];

            ciphertext = ciphertext.toUpperCase().replace(/[^A-Z]/g, '');
            if (!ciphertext) return '';

            let plaintext = '';
            for (let i = 0; i < ciphertext.length; i += 2) {
                const c1 = ciphertext.charCodeAt(i) - 65;
                const c2 = ciphertext.charCodeAt(i + 1) - 65;

                const p1 = mod(K_inv[0][0] * c1 + K_inv[0][1] * c2, 26);
                const p2 = mod(K_inv[1][0] * c1 + K_inv[1][1] * c2, 26);

                plaintext += String.fromCharCode(p1 + 65) + String.fromCharCode(p2 + 65);
            }
            return plaintext;
        }

        // -------------------------------------------------------------
        // 4. XỬ LÝ SỰ KIỆN GIAO DIỆN
        // -------------------------------------------------------------
        function handleEncrypt() {
            const K = getMatrixK();
            const input = document.getElementById('inputText').value;
            const result = encryptHill(input, K);
            document.getElementById('outputText').innerText = result || '---';
        }

        function handleDecrypt() {
            const K = getMatrixK();
            const input = document.getElementById('inputText').value;
            const result = decryptHill(input, K);
            if (result) {
                document.getElementById('outputText').innerText = result;
            }
        }

        function handleSwap() {
            const output = document.getElementById('outputText').innerText;
            if (output && output !== '---') {
                document.getElementById('inputText').value = output;
            }
        }

        // Khởi tạo kiểm tra ban đầu
        checkMatrixStatus();
    </script>
</body>

</html>
